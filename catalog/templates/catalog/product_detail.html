{% extends 'catalog/base.html' %}

{% block title %}Товар {{ object.product_name }}{% endblock %}
{% load my_tags %}
{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center mb-3">
    <h1 class="display-1 mb-3">Skystore</h1>
</div>
<div class="container">
    <h2 class="card-title pricing-card-title text-center mb-5"></h2>
    <div class="row">
        <div class="col"></div>
        <div class="col-10">
            <div class="card mb-4 box-shadow">
                <div class="card-body">
                    <h1 class="my-0 font-weight-normal mb-5 ">{{ object.product_name }}</h1>
                    <div class="row ">
                        <div class="col-5">
                            <img src="{{ product.image | media_filter }}" alt="###">
                        </div>
                        <div class="col-6">
                            <p class="card-text lead mt-5 mb-5">{{ object.description }}</p>
                        </div>
                    </div>
                    <h2 class="card-title pricing-card-title mb-3 mt-5"> {{ object.price }} ₽ </h2>
                    <button type="button" class="btn btn-primary btn-lg">В корзину</button>
                    <a class="btn btn-secondary btn-lg" href="{% url 'catalog:product_list' %}">Назад</a>
                </div>
            </div>
        </div>
        <div class="col"></div>
    </div>
</div>
{% endblock %}
