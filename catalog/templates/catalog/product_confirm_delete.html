{% extends 'catalog/base.html' %}

{% block title %}Подтверждение на удаление{{ object.product_name }}{% endblock %}
{% load my_tags %}
{% block content %}
<div class="row">
    <div class="col-3"></div>
    <div class="col">
        <div class="container mt-5 text-center">
            <div class="card">
                <h3 class="card-title pricing-card-title text-center mb-3 mt-5">Действительно хотите удалить "{{ object.product_name }}"?</h3>
                <form method="post" >
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary mb-5 mt-3">Удалить</button>
                    <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary mb-5 mt-3">Отмена</a>
                </form>
            </div>
        </div>
    </div>
    <div class="col-3"></div>
</div>
{% endblock %}
