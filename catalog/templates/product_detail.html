{% extends 'base.html' %}

{% block title %}Главная страница{% endblock %}
{% load my_tags %}
{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center mb-3">
    <h1 class="display-1 mb-3">Skystore</h1>
</div>
<div class="container">
    <h2 class="card-title pricing-card-title text-center mb-5"></h2>
    <div class="row">
        <div class="col-3"></div>
        <div class="col-6">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h3 class="my-0 font-weight-normal text-center">{{ product.product_name }}</h3>
                </div>
                <div class="card-body">
                    <div class="text-center">
                        <img src="{{ product.image | media_filter }}" alt="###">
                    </div>
                    <p class="card-text lead mt-5 mb-5">{{ product.description }}</p>
                    <h2 class="card-title pricing-card-title mb-3 mt-5"> {{ product.price }} ₽ </h2>
                    <button type="button" class="btn btn-primary btn-lg">В корзину</button>
                    <a class="btn btn-secondary btn-lg" href="{% url 'catalog:product_list' %}">Назад</a>
                </div>
            </div>
        </div>
        <div class="col-3"></div>
    </div>
</div>
{% endblock %}
