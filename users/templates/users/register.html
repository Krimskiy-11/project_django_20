{% extends 'catalog/base.html' %}

{% block title %} Регистрация {% endblock %}
{% load my_tags %}
{% block content %}

<div class="card text-bg-dark mb-5">
  <img src="/media/images/faf (1).jpg" class="card-img" alt="###">
  <div class="card-img-overlay pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center mb-3">
    <h1 class="display-1 mb-3">Skystore</h1>
    <p class="lead mb-4 mt-4">Skystore - это интернет-магазин для покупки оригинальной цифровой техники по выгодным ценам.</p>
  </div>
</div>

<div class="row">
    <div class="col-3"></div>
    <div class="col">
        <div class="container mt-5">
            <div class="card">
                <h2 class="card-title pricing-card-title text-center mb-5 mt-3">Регистрация</h2>
                <div class="container ms-3 pe-5">
                    <form method="post" >
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary mb-5 mt-3">Зарегистрироваться</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="col-3"></div>
</div>
{% endblock %}
